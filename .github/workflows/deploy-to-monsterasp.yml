name: Build & Deploy to MonsterASP

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore CNCToolingDatabase/CNctoolingDatabase.csproj

      - name: Build
        run: dotnet build CNCToolingDatabase/CNctoolingDatabase.csproj --configuration Release --no-restore

      - name: Publish
        run: dotnet publish CNCToolingDatabase/CNctoolingDatabase.csproj --configuration Release --output ./publish --runtime win-x64 --self-contained false -p:PublishTrimmed=false

      - name: Deploy via WebDeploy
        run: >-
          & "C:\Program Files\IIS\Microsoft Web Deploy V3\msdeploy.exe"
          -verb:sync
          -source:contentPath="$(Resolve-Path ./publish)"
          "-dest:contentPath=${{ secrets.WEBSITE_NAME }},computerName=https://${{ secrets.SERVER_COMPUTER_NAME }}/msdeploy.axd?site=${{ secrets.WEBSITE_NAME }},userName=${{ secrets.SERVER_USERNAME }},password=${{ secrets.SERVER_PASSWORD }},authtype=Basic"
          -allowUntrusted
          -enableRule:AppOffline
