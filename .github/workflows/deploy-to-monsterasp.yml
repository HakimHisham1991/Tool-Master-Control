name: Build & Deploy to MonsterASP

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore CNCToolingDatabase/CNctoolingDatabase.csproj

      - name: Build
        run: dotnet build CNCToolingDatabase/CNctoolingDatabase.csproj --configuration Release --no-restore

      - name: Publish
        run: dotnet publish CNCToolingDatabase/CNctoolingDatabase.csproj --configuration Release --output ./publish --runtime win-x64 --self-contained false -p:PublishTrimmed=false

      # ====================== STOP THE SITE ======================
      - name: Create app_offline.htm locally
        run: |
          Set-Content -Path ./app_offline.htm -Value "<!DOCTYPE html><html><body><h2>Site is updating, please wait...</h2></body></html>"

      - name: Upload app_offline.htm to stop site
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./
          server-dir: /wwwroot/
          exclude: |
            **
            !app_offline.htm
          dangerous-clean-slate: false

      - name: Wait for IIS to release file locks
        run: Start-Sleep -Seconds 15

      # ====================== DEPLOY FILES ======================
      - name: Deploy via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./publish/
          server-dir: ${{ secrets.FTP_SERVER_DIR }}
          dangerous-clean-slate: false

      # ====================== START THE SITE ======================
      - name: Remove app_offline.htm to restart site
        run: |
          $ftp = [System.Net.FtpWebRequest]::Create("ftp://${{ secrets.FTP_SERVER }}/wwwroot/app_offline.htm")
          $ftp.Method = [System.Net.WebRequestMethods+Ftp]::DeleteFile
          $ftp.Credentials = New-Object System.Net.NetworkCredential("${{ secrets.FTP_USERNAME }}", "${{ secrets.FTP_PASSWORD }}")
          $ftp.GetResponse() | Out-Null
          Write-Host "app_offline.htm removed, site is back online."
