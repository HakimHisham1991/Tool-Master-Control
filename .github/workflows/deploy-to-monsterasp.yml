name: Build & Deploy to MonsterASP

on:
  push:
    branches: [ main ]
  workflow_dispatch:   # Manual trigger option

jobs:
  deploy:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore CNCToolingDatabase/CNctoolingDatabase.csproj

      - name: Build
        run: dotnet build CNCToolingDatabase/CNctoolingDatabase.csproj --configuration Release --no-restore

      - name: Publish
        run: |
          dotnet publish CNCToolingDatabase/CNctoolingDatabase.csproj \
            --configuration Release \
            --output ./publish \
            --runtime win-x64 \
            --self-contained false \
            -p:PublishTrimmed=false

      # ====================== STOP THE SITE ======================
      - name: Upload app_offline.htm (Stop Application)
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./
          server-dir: ./wwwroot/
          include: app_offline.htm
          dangerous-clean-slate: false

      - name: Wait for app to shutdown
        run: Start-Sleep -Seconds 10

      # ====================== DEPLOY NEW FILES ======================
      - name: Deploy via WebDeploy (Recommended)
        uses: rasmusbuchholdt/simply-web-deploy@2.1.0
        with:
          website-name: ${{ secrets.WEBSITE_NAME }}
          server-computer-name: ${{ secrets.SERVER_COMPUTER_NAME }}
          server-username: ${{ secrets.SERVER_USERNAME }}
          server-password: ${{ secrets.SERVER_PASSWORD }}
          source-path: './publish'
          # clean: true   # Uncomment if you want to delete old files first

      # ====================== START THE SITE ======================
      - name: Remove app_offline.htm (Restart Application)
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./
          server-dir: ./wwwroot/
          include: app_offline.htm
          delete: true   # This removes the file

      - name: Final Wait & Health Check
        run: Start-Sleep -Seconds 5
